app-id: com.cleanlauncher.Launcher
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: launcher
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --device=dri
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/jdk
      - cp -r . /app/jdk/jdk
    sources:
      - type: archive
        url: https://download.java.net/java/GA/jdk17.0.2/dfd4a8d0985749f896bed50d7138ee7f/8/GPL/openjdk-17.0.2_linux-x64_bin.tar.gz
        sha256: 0022753d0cceecacdd3a795dd4cea2bd7ffdf9dc06e22ffd1be98411742fbb44
  - name: gamemode
    buildsystem: meson
    config-opts:
      - -Dwith-sd-bus-provider=no-daemon
      - -Dwith-util=false
      - -Dwith-examples=false
      - -Dwith-pam-renicing=false
    sources:
      - type: archive
        url: https://github.com/FeralInteractive/gamemode/archive/refs/tags/1.8.2.tar.gz
        sha256: 2b4a20894822caf04767af6a1601130d6b718fc30b8a77895607341b1674740f
  - name: cmark
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMARK_TESTS=OFF
      - -DCMARK_SHARED=ON
      - -DCMARK_STATIC=OFF
    sources:
      - type: archive
        url: https://github.com/commonmark/cmark/archive/refs/tags/0.31.0.tar.gz
        sha256: bbcb8f8c03b5af33fcfcf11a74e9499f20a9043200b8552f78a6e8ba76e04d11
  - name: tomlplusplus
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/marzer/tomlplusplus/archive/refs/tags/v3.4.0.tar.gz
        sha256: 8517f65938a4faae9ccf8ebb36631a38c1cadfb5efa85d9a72e15b9e97d25155
  - name: libarchive
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TEST=OFF
      - -DENABLE_TAR=OFF
      - -DENABLE_CPIO=OFF
      - -DENABLE_CAT=OFF
      - -DENABLE_ACL=OFF
      - -DENABLE_XATTR=OFF
      - -DENABLE_ICONV=OFF
    sources:
      - type: archive
        url: https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.gz
        sha256: 7875d49596286055b52439ed42f044bd8ad426aa4cc5aabd96bfe7abb971d5e8
  - name: qrencode
    buildsystem: cmake-ninja
    config-opts:
      - -DWITHOUT_TOOLS=ON
    sources:
      - type: archive
        url: https://github.com/fukuchi/libqrencode/archive/refs/tags/v4.1.1.tar.gz
        sha256: 5385bc1b8c2f20f3b91d258bf8ccc8cf62023935df2d2676b5b67049f31a049c
  - name: launcher
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_JAVA_COMPILER=/app/jdk/jdk/bin/javac
    build-options:
      append-path: /app/jdk/jdk/bin
      env:
        JAVA_HOME: /app/jdk/jdk
    sources:
      - type: dir
        path: ..
