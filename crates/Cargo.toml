[workspace]
resolver = "2"
members = [
    "error",
    "archive",
    "filesystem",
    "gzip",
    "hashing",
    "http_client",
    "json",
    "markdown",
    "mod_metadata",
    "settings",
    "string_utils",
    "core", "auth", "download_manager", "process_launcher"
, "auth", "download_manager", "process_launcher"]
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
