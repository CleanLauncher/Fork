name: E2E Tekkit

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-tekkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Tekkit tests
        run: cargo test --test instance_tests test_create_tekkit_instance
        working-directory: crates
