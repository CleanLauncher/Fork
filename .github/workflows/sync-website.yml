name: Sync Website

on:
  push:
    branches:
      - master
    paths:
      - "website/**"

permissions: {}

jobs:
  sync:
    name: Push website to CleanLauncher/website

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to website repo
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_PAT }}
        run: |
          AUTHOR_NAME=$(git log -1 --format='%an' "$GITHUB_SHA")
          AUTHOR_EMAIL=$(git log -1 --format='%ae' "$GITHUB_SHA")
          COMMIT_MSG=$(git log -1 --format='%s' "$GITHUB_SHA")

          git clone https://x-access-token:${WEBSITE_TOKEN}@github.com/CleanLauncher/website.git /tmp/website-repo
          cd /tmp/website-repo
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git rm -rf . 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/website/." .
          rm -rf .git
          git init
          git remote add origin https://x-access-token:${WEBSITE_TOKEN}@github.com/CleanLauncher/website.git
          git fetch origin
          git checkout -B main origin/main
          git add -A
          git diff --cached --quiet && echo "No changes to push" && exit 0
          GIT_AUTHOR_NAME="$AUTHOR_NAME" GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL" \
          GIT_COMMITTER_NAME="$AUTHOR_NAME" GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL" \
          git commit -m "$COMMIT_MSG"
          git push origin main
